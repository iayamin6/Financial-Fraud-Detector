[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-signals"
version = "0.1.0"
description = "Explainable five-layer fraud detection research demo"
requires-python = ">=3.11,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "pyyaml>=6,<7",
 "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<1.9",
 "imbalanced-learn>=0.14,<0.15", "xgboost>=3,<4", "networkx>=3.3,<4",
 "joblib>=1.4,<2", "transformers==4.57.3", "torch>=2.6,<3",
 "sentence-transformers>=3,<6", "spacy>=3.8,<4", "shap>=0.48,<1", "lime==0.2.0.1",
 "streamlit>=1.40,<2", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["fraud*", "api*", "dashboard*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
